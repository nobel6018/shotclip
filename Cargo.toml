[package]
name = "shotclip"
version = "0.3.0"
edition = "2021"
description = "Screenshot tool for Windows: macOS-style capture, scrolling capture, OCR, colour picker, pixel ruler + Clop-style clipboard optimiser"
license = "GPL-3.0-or-later" # imagequant (libimagequant) is GPL-3.0

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
imagequant = "4"
minisign-verify = "0.2"
serde_json = "1"
windows = { version = "0.58", features = [
    "Foundation","Foundation_Collections","Globalization",
    "Graphics_Imaging","Media_Ocr","Storage_Streams",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation","Win32_Security","Win32_Graphics_Gdi","Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_Urlmon",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_Globalization",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
