[package]
name = "shrinkclip"
version = "0.1.0"
edition = "2021"
description = "Clop-style clipboard screenshot optimiser for Windows"
license = "GPL-3.0-or-later" # imagequant (libimagequant) is GPL-3.0

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.17"
imagequant = "4"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation","Win32_Security","Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
